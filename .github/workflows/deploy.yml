name: Deploy to GitHub Pages

# Einmalig im Repo: Settings -> Pages -> Source: "GitHub Actions".
# (Der GITHUB_TOKEN darf die Pages-Site nicht selbst per API anlegen -
#  "Resource not accessible by integration" -, deshalb kein configure-pages hier.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          # Projekt-Repo -> Auslieferung unter https://<user>.github.io/karaoke-app/
          NUXT_APP_BASE_URL: /karaoke-app/
          # Kein Backend auf Pages: App laeuft offline mit importierten .ksong-Songs
          NUXT_PUBLIC_API_BASE: ""

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/.output/public

      - id: deployment
        uses: actions/deploy-pages@v5
