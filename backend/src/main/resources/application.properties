spring.application.name=karaoke-app

# Server
server.port=8080

# H2 als dateibasierte DB - kein separater DB-Server noetig, reicht fuer 2 Nutzer
spring.datasource.url=jdbc:h2:file:./data/karaoke-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ablageort fuer hochgeladene Song-Artefakte (instrumental.wav, lyrics.json, ...)
karaoke.storage.base-dir=../data/songs

# Upload-Limits hochsetzen (Instrumental-Tracks als WAV koennen mehrere zehn MB gross sein)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
