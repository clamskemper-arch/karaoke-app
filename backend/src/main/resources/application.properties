spring.application.name=karaoke-app

# Server
server.port=${PORT:8080}

# H2 als dateibasierte DB - kein separater DB-Server noetig, reicht fuer 2 Nutzer.
# KARAOKE_DB_FILE zeigt im Container auf das persistente Volume (z.B. /data/karaoke-db).
spring.datasource.url=jdbc:h2:file:${KARAOKE_DB_FILE:./data/karaoke-db};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ablageort fuer hochgeladene Song-Artefakte (instrumental.wav, lyrics.json, ...)
# Im Container auf das persistente Volume legen (KARAOKE_STORAGE_DIR=/data/songs).
karaoke.storage.base-dir=${KARAOKE_STORAGE_DIR:../data/songs}

# Ordner mit vorbereiteten .ksong-Bundles fuer den Heimnetz-Download (GET /songs).
karaoke.share.dir=${KARAOKE_SHARE_DIR:../share}

# Erlaubte CORS-Origins (kommagetrennt, unterstuetzt Wildcards wie in
# allowedOriginPatterns). Default deckt lokalen Dev + Tailscale + die GitHub-Pages-
# App ab; per KARAOKE_CORS_ORIGINS ueberschreibbar.
karaoke.cors.allowed-origins=${KARAOKE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://100.*.*.*:*,https://*.ts.net,https://clamskemper-arch.github.io}

# Upload-Limits hochsetzen (Instrumental-Tracks als WAV koennen mehrere zehn MB gross sein)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Nur den Health-Endpoint nach aussen geben (fuer Container-/Reverse-Proxy-Healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
