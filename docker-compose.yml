# Backend der Karaoke-App. Frontend liegt auf GitHub Pages (statisch) und ist
# hier nicht enthalten - siehe docs/DEPLOY.md.
#
#   docker compose up -d --build
#
# Der Port wird nur an 127.0.0.1 gebunden: von aussen erreichbar wird das Backend
# ausschliesslich ueber `tailscale serve` (HTTPS, nur Tailnet) - siehe DEPLOY.md.

services:
  backend:
    build: ./backend
    image: karaoke-app-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Kommagetrennt; Default steht in application.properties. Hier ggf. den
      # konkreten MagicDNS-Namen des Servers eintragen.
      KARAOKE_CORS_ORIGINS: "https://clamskemper-arch.github.io,https://*.ts.net,http://localhost:*"
    volumes:
      - karaoke-data:/data

volumes:
  karaoke-data:

